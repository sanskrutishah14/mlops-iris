name: CD

# Runs automatically after CI succeeds on main (or manually from the Actions tab).
# Streamlit Community Cloud redeploys the Streamlit app by itself on every push to main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR needs lowercase)
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/iris-api" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (sha + latest tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1

      - name: Pull image from GHCR and load into cluster
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE
          kind load docker-image $IMAGE
          sed -i "s|image: iris-api:latest|image: $IMAGE|" k8s/deployment.yaml

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/iris-api --timeout=180s
          kubectl get pods,svc

      - name: Smoke test deployed service
        run: |
          kubectl port-forward svc/iris-api 8080:80 &
          sleep 5
          curl -f http://localhost:8080/health
          curl -f -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'

      - name: Roll back on failure (shows kubectl rollout undo)
        if: failure()
        run: |
          kubectl describe pods || true
          kubectl rollout undo deployment/iris-api || true
